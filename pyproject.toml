[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niriksha"
version = "0.0.0"
description = "Niriksha - The LLM Evaluation Arena: reproducible evaluation of LLMs and small language models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.16.9",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/niriksha"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
